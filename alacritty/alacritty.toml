[general]
# theme.toml is a symlink set by dotfiles-theme: tokyo-night.toml next to this
# file, or a theme from https://github.com/alacritty/alacritty-theme (cloned by
# link.sh into ~/.config/alacritty/themes).
import = [ "~/.config/alacritty/theme.toml" ]

[window]
startup_mode = "Maximized"

[font]
normal = { family = "JetBrainsMono", style = "Regular" }
size = 15

# Shift+Enter inserts a newline in Claude Code (added by /terminal-setup)
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
