unbind r
bind r source-file ~/.tmux.conf
set-window-option -g xterm-keys on

set -g default-terminal "tmux-256color"
set-option -g set-clipboard on

set -g prefix C-s

setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n F1 select-window -t 0
bind -n F2 select-window -t 1
bind -n F3 select-window -t 2
bind -n F4 select-window -t 3
bind -n F5 select-window -t 4
bind -n F6 select-window -t 5
bind -n F7 select-window -t 6
bind -n F8 select-window -t 7

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key X confirm-before -p "Kill this session? (y/n)" "kill-session"

# lazygit in its own window, in the current pane's directory. Quitting lazygit
# closes the window and returns to where you were.
bind g new-window -n lazygit -c "#{pane_current_path}" lazygit

# Ctrl+h/j/k/l moves between panes and nvim splits (vim-tmux-navigator below),
# which takes Ctrl+l from the shell: prefix + Ctrl+l clears the screen instead.
bind C-l send-keys 'C-l'

# open new panes and windows in same dir
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'erikw/tmux-powerline'
set -as terminal-features ",*:RGB"
set -g status-position top
# Theme plugin, a symlink set by dotfiles-theme (solarized or tokyonight).
# Reset what the themes set first, so a reload after switching does not keep
# the previous theme's colors (e.g. solarized's white status-bg).
set -gu status-bg ; set -gu status-fg ; set -gu status-style
set -gu status-left ; set -gu status-left-style ; set -gu status-right ; set -gu status-right-style
set -gu status-justify ; set -gu window-status-separator
set -gu window-status-format ; set -gu window-status-current-format
set -gu window-status-style ; set -gu window-status-current-style ; set -gu window-status-activity-style
set -gu message-style ; set -gu message-command-style ; set -gu mode-style
set -gu pane-border-style ; set -gu pane-active-border-style ; set -gu pane-border-status
set -gu display-panes-colour ; set -gu display-panes-active-colour
set -gu clock-mode-colour ; set -gu clock-mode-style
source-file -q ~/.config/tmux/theme.conf

# set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override theme defaults (themes set a short status-left-length).
# Your session name is your path, so allow it to use more width when available.
set -g status-left-length 200
